<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sistema de Control de Asistencia - Escuela</title>
  
  <!-- Tipografía moderna (Inter) e Íconos (FontAwesome) -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  
  <link rel="stylesheet" href="styles.css">
</head>
<body>

  <!-- Encabezado / Header -->
  <header class="navbar">
    <div class="logo">
      <i class="fa-solid fa-graduation-cap"></i>
      <span>Control de Asistencia</span>
    </div>
    <div class="user-info">
      <i class="fa-solid fa-user-gear"></i>
      <span>Preceptoría</span>
    </div>
  </header>

  <!-- Contenedor Principal -->
  <main class="contenedor-principal">
    
    <!-- Tarjetas de Estadísticas Rápida -->
    <section class="tarjetas-stats">
      <div class="card-stat total">
        <i class="fa-solid fa-users"></i>
        <div>
          <h3>30</h3>
          <p>Total Alumnos</p>
        </div>
      </div>
      <div class="card-stat presentes">
        <i class="fa-solid fa-circle-check"></i>
        <div>
          <h3>25</h3>
          <p>Presentes</p>
        </div>
      </div>
      <div class="card-stat ausentes">
        <i class="fa-solid fa-circle-xmark"></i>
        <div>
          <h3>4</h3>
          <p>Ausentes</p>
        </div>
      </div>
      <div class="card-stat tardanzas">
        <i class="fa-solid fa-clock"></i>
        <div>
          <h3>1</h3>
          <p>Tardanzas</p>
        </div>
      </div>
    </section>

    <!-- Panel de Filtros -->
    <section class="panel-filtros">
      <div class="grupo-control">
        <label for="curso"><i class="fa-solid fa-chalkboard-user"></i> Curso</label>
        <select id="curso">
          <option value="5P">5° P - Programación</option>
          <option value="4P">4° P - Programación</option>
          <option value="6P">6° P - Programación</option>
        </select>
      </div>

      <div class="grupo-control">
        <label for="fecha"><i class="fa-solid fa-calendar-day"></i> Fecha</label>
        <input type="date" id="fecha" value="2026-10-15">
      </div>

      <div class="grupo-control buscador">
        <label for="buscar"><i class="fa-solid fa-magnifying-glass"></i> Buscar Alumno</label>
        <input type="text" id="buscar" placeholder="Ej: Perez, Juan...">
      </div>
    </section>

    <!-- Tabla de Alumnos -->
    <section class="contenedor-tabla">
      <table class="tabla-asistencia">
        <thead>
          <tr>
            <th>#</th>
            <th>Alumno</th>
            <th>Estado</th>
            <th>Acciones</th>
          </tr>
        </thead>
        <tbody id="lista-alumnos">
          <tr>
            <td>1</td>
            <td><strong>García, Matías</strong></td>
            <td><span class="badge presente">Presente</span></td>
            <td>
              <div class="botones-estado">
                <button class="btn-p activo" title="Presente"><i class="fa-solid fa-check"></i> P</button>
                <button class="btn-a" title="Ausente"><i class="fa-solid fa-xmark"></i> A</button>
                <button class="btn-t" title="Tardanza"><i class="fa-solid fa-clock"></i> T</button>
              </div>
            </td>
          </tr>
          <tr>
            <td>2</td>
            <td><strong>López, Sofía</strong></td>
            <td><span class="badge ausente">Ausente</span></td>
            <td>
              <div class="botones-estado">
                <button class="btn-p" title="Presente"><i class="fa-solid fa-check"></i> P</button>
                <button class="btn-a activo" title="Ausente"><i class="fa-solid fa-xmark"></i> A</button>
                <button class="btn-t" title="Tardanza"><i class="fa-solid fa-clock"></i> T</button>
              </div>
            </td>
          </tr>
          <tr>
            <td>3</td>
            <td><strong>Martínez, Lucas</strong></td>
            <td><span class="badge tardanza">Tardanza</span></td>
            <td>
              <div class="botones-estado">
                <button class="btn-p" title="Presente"><i class="fa-solid fa-check"></i> P</button>
                <button class="btn-a" title="Ausente"><i class="fa-solid fa-xmark"></i> A</button>
                <button class="btn-t activo" title="Tardanza"><i class="fa-solid fa-clock"></i> T</button>
              </div>
            </td>
          </tr>
        </tbody>
      </table>
    </section>

    <!-- Botón de Guardado -->
    <div class="acciones-guardar">
      <button id="btn-guardar" class="btn-principal">
        <i class="fa-solid fa-floppy-disk"></i> Guardar Asistencia
      </button>
    </div>

  </main>

  <script src="script.js"></script>
</body>
</html>
</body>
</html>
